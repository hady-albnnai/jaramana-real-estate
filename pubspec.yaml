name: sweeda_real_estate
description: تطبيق عقارات السويداء — مكتب عقاري إلكتروني
publish_to: 'none'
# ⚠️ سياسة Google Play (2026-08-14):
#   • ما قبل «+» = versionName — يراه المستخدم بالمتجر، نص حر بلا قيود.
#   • ما بعد «+» = versionCode — عدد صحيح، **يجب أن يزيد مع كل رفعة**،
#     لا يتكرر ولا يتراجع أبداً (رقم مستهلَك = رفض فوري)، وحدُّه 2100000000.
#   بدأنا من 10 (لا من 1) لترك مساحة للرفعات التجريبية.
#   `android/app/build.gradle.kts` يقرأ الاثنين من هنا (flutter.versionCode/Name)،
#   و`package_info_plus` يقرأهما وقت التشغيل من الـAPK نفسه ⇒ مصدر واحد للحقيقة.
version: 1.0.0+10

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase Backend
  supabase_flutter: ^2.8.0

  # State Management
  provider: ^6.1.1

  # UI & Utilities
  cached_network_image: ^3.3.0
  image_picker: ^1.0.7
  flutter_image_compress: ^2.3.0
  intl: ^0.19.0
  url_launcher: ^6.2.2
  share_plus: ^12.0.2
  flutter_local_notifications: ^17.0.0

  # Navigation
  go_router: ^13.0.0

  # Storage & Cache
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2

  # محادثة الاستشارة: تسجيل وتشغيل الرسائل الصوتية
  record: ^5.2.1
  just_audio: ^0.9.42

  # Networking
  http: ^1.2.2
  http_parser: ^4.0.2

  # قراءة الإصدار ورقم البناء من الـAPK نفسه وقت التشغيل — لا نص ثابت
  package_info_plus: ^8.0.2

  # Utils
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0
  carousel_slider: ^4.2.1
  dotted_border: ^2.1.0
  flutter_rating_bar: ^4.0.1
  sms_autofill: ^2.3.0

  # === المرحلة D: فيديو + خريطة ===
  video_player: ^2.8.2
  chewie: ^1.7.4
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^11.0.0

  # === المرحلة E2: Firebase FCM (Push Notifications) ===
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true

  assets:
    - assets/images/
